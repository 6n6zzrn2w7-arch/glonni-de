# Lädt die Website bei jeder Änderung automatisch per SFTP zu IONOS hoch.
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SFTP_HOST      z. B. access123456789.webspace-data.io
#   SFTP_USER      SFTP-Benutzername aus dem IONOS-Konto
#   SFTP_PASSWORD  SFTP-Passwort
#   SFTP_DIR       Zielordner auf dem Webspace, z. B. /glonni-de  (der Ordner, mit dem glonni.de verbunden ist)
name: Auf IONOS veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Dateien holen
        uses: actions/checkout@v5

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per SFTP zu IONOS hochladen
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST || vars.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER || vars.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.SFTP_DIR || vars.SFTP_DIR }}
        run: |
          set -e
          missing=""
          for v in SFTP_HOST SFTP_USER SFTP_PASSWORD SFTP_DIR; do
            if [ -z "${!v}" ]; then missing="$missing $v"; else echo "✓ $v ist hinterlegt"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Fehlende Repository-Secrets:$missing  →  Settings › Secrets and variables › Actions › Reiter 'Secrets' › 'New repository secret' (nicht Environment/Codespaces/Dependabot)"
            exit 1
          fi
          # Leerzeichen/Zeilenumbrüche aus Kopieren entfernen, Präfix sftp:// tolerieren
          SFTP_HOST="$(echo "$SFTP_HOST" | tr -d '[:space:]')"; SFTP_HOST="${SFTP_HOST#sftp://}"; SFTP_HOST="${SFTP_HOST%/}"
          SFTP_USER="$(echo "$SFTP_USER" | tr -d '[:space:]')"
          SFTP_DIR="$(echo "$SFTP_DIR" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export LFTP_PASSWORD="$SFTP_PASSWORD"
          CMDS="set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; mkdir -p -f '$SFTP_DIR'; mirror --reverse --verbose --parallel=4 --exclude '^\.git/' --exclude '^\.github/' --exclude '^\.gitignore\$' --exclude '^README\.md\$' ./ '$SFTP_DIR'; bye"
          lftp --env-password -u "$SFTP_USER" -e "$CMDS" "sftp://$SFTP_HOST"
          echo "✅ Website ist online."

      - name: Live-Check glonni.de
        if: always()
        continue-on-error: true
        run: |
          sleep 5
          echo "== DNS =="
          for h in glonni.de www.glonni.de; do echo "$h A:    $(dig +short $h A | tr '\n' ' ')"; echo "$h CNAME: $(dig +short $h CNAME | tr '\n' ' ')"; done
          echo "NS: $(dig +short glonni.de NS | tr '\n' ' ')"
          for u in https://glonni.de/ https://www.glonni.de/ http://glonni.de/ https://glonni.de/gelaende.html; do
            echo "== $u =="
            curl -s -o /dev/null -D - --max-time 20 "$u" | grep -iE '^(HTTP/|server:|www-authenticate:|location:|x-nf-|content-type:)' || echo "keine Antwort"
          done
          echo "== SSL-Zertifikat glonni.de =="
          echo | openssl s_client -servername glonni.de -connect glonni.de:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "kein gültiges Zertifikat abrufbar"
          for u in https://glonni.de/ https://www.glonni.de/; do
            printf "%s  ->  " "$u"; curl -s -o /dev/null --max-time 20 -w "HTTP %{http_code}, SSL-Prüfung %{ssl_verify_result} (0 = ok)\n" "$u" || echo "Fehler (Zertifikat ungültig?)"
          done
          echo "== Inhalt Startseite (Titel) =="
          curl -s --max-time 20 https://glonni.de/ | grep -o '<title>[^<]*</title>' || true
